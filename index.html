<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Private Messeng</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7fb;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(390px,100%);background:#151c2e;padding:26px;border-radius:20px;box-shadow:0 15px 50px #0005}.card h1{margin:0 0 5px}.muted{color:#8e99ae;font-size:14px}.card input{width:100%;padding:13px;margin-top:10px;border-radius:11px;border:1px solid #303b55;background:#0e1525;color:#fff;outline:none}.card button,.send{background:#3b82f6;color:#fff;border:0;border-radius:11px;padding:13px;margin-top:10px;font-weight:bold}.card button{width:100%}.err{color:#ff8c8c;min-height:20px;margin-top:10px;font-size:13px}.switch{margin-top:14px;text-align:center;color:#9ba6ba;font-size:14px}.switch b{color:#75a7ff;cursor:pointer}.app{height:100dvh;display:flex;max-width:1100px;margin:auto;background:#101827}.users{width:300px;border-right:1px solid #273149;display:flex;flex-direction:column}.head{padding:17px;border-bottom:1px solid #273149;font-weight:bold}.search{padding:10px}.search input{width:100%;background:#151e30;border:1px solid #303b55;color:#fff;border-radius:10px;padding:10px}.list{overflow:auto}.user{padding:14px 16px;border-bottom:1px solid #202a3e;cursor:pointer}.user:hover,.user.active{background:#1b2740}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d17c;margin-right:8px}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.chathead{padding:17px;border-bottom:1px solid #273149;font-weight:bold}.messages{flex:1;overflow:auto;padding:18px}.msg{margin:9px 0;display:flex}.msg.mine{justify-content:flex-end}.bubble{max-width:min(75%,520px);background:#202b40;padding:9px 12px;border-radius:14px;overflow-wrap:anywhere}.mine .bubble{background:#2f64c7}.time{font-size:10px;color:#aab5c8;margin-top:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #273149;padding-bottom:max(12px,env(safe-area-inset-bottom))}.composer input{flex:1;background:#151e30;border:1px solid #303b55;color:#fff;border-radius:12px;padding:12px;min-width:0}.send{margin:0;padding:12px 17px}.empty{margin:auto;color:#858fa4;text-align:center}.logout{margin:0 12px 12px;padding:10px;background:#202a3e;color:#fff;border:0;border-radius:9px}.hide{display:none!important}.config{margin-top:14px;font-size:12px;color:#8e99ae}.config code{color:#c8d4ef}@media(max-width:650px){.users{width:115px}.user{padding:14px 8px;font-size:12px}.head{padding:15px 8px;font-size:13px}.search{padding:6px}.search input{font-size:11px}.bubble{max-width:88%}}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="card">
<h1>🔒 Private Messeng</h1><div class="muted">Простой мессенджер для своих</div>
<div id="login"><input id="lu" autocomplete="username" placeholder="Username"><input id="lp" autocomplete="current-password" type="password" placeholder="Пароль"><button onclick="doLogin()">Войти</button><div class="switch">Нет аккаунта? <b onclick="toggle()">Создать</b></div></div>
<div id="reg" class="hide"><input id="ru" autocomplete="username" placeholder="Username"><input id="rp" autocomplete="new-password" type="password" placeholder="Пароль (от 4 символов)"><button onclick="doReg()">Создать аккаунт</button><div class="switch">Уже есть аккаунт? <b onclick="toggle()">Войти</b></div></div>
<div id="err" class="err"></div>
<div class="config" id="config"></div>
</div></div>
<div id="app" class="app hide"><aside class="users"><div class="head">👥 Люди</div><div class="search"><input id="search" placeholder="Поиск" oninput="renderUsers()"></div><div id="list" class="list"></div><button class="logout" onclick="logout()">Выйти</button></aside>
<section class="chat"><div id="chathead" class="chathead">Выберите человека</div><div id="messages" class="messages"><div class="empty">Выберите человека слева</div></div><form class="composer" onsubmit="send(event)"><input id="text" placeholder="Сообщение..." disabled><button class="send" id="send" disabled>➤</button></form></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ВСТАВЬ СЮДА ДВА ЗНАЧЕНИЯ ИЗ SUPABASE: Project URL и anon/public key. */
const SUPABASE_URL='https://ukutofgxcdsnpjftloxb.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_uuNwzGKCKd99_kM89BND1Q_SgWKjc2t';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let me=null,current=null,allUsers=[],channel=null;
const $=id=>document.getElementById(id);
function toggle(){$('login').classList.toggle('hide');$('reg').classList.toggle('hide');$('err').textContent=''}
function validName(x){return /^[a-zA-Zа-яА-ЯёЁ0-9 _-]{2,24}$/.test(x)}
async function doReg(){
  try{let username=$('ru').value.trim(),password=$('rp').value;if(!validName(username))throw Error('Username: 2–24 символа');if(password.length<4)throw Error('Пароль минимум 4 символа');
    let bytes=new TextEncoder().encode(username.toLowerCase());let hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');let email='u'+hex+'@private-messeng.local';
    let {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;if(!data.session)throw Error('В Supabase нужно отключить подтверждение email: Authentication → Providers → Email → Confirm email = OFF');start(data.session)
  }catch(e){$('err').textContent=e.message||'Ошибка регистрации'}
}
async function doLogin(){try{let username=$('lu').value.trim(),password=$('lp').value;let {data:em,error:ee}=await sb.rpc('login_email',{p_username:username});if(ee)throw ee;if(!em)throw Error('Пользователь не найден');let {data,error}=await sb.auth.signInWithPassword({email:em,password});if(error)throw error;start(data.session)}catch(e){$('err').textContent=e.message||'Ошибка входа'}}
async function start(session){if(!session)return;let {data:{user},error}=await sb.auth.getUser();if(error)throw error;me=user.user_metadata.username||user.email.split('@')[0];$('auth').classList.add('hide');$('app').classList.remove('hide');await loadUsers();subscribe()}
async function loadUsers(){let {data,error}=await sb.from('profiles').select('id,username').order('username');if(error){$('err').textContent=error.message;return}allUsers=(data||[]).filter(x=>x.id!==(await sb.auth.getUser()).data.user.id);renderUsers()}
function renderUsers(){let q=$('search').value.trim().toLowerCase();let list=allUsers.filter(u=>u.username.toLowerCase().includes(q));$('list').innerHTML=list.length?list.map(u=>`<div class="user ${u.username===current?'active':''}" onclick="openChat('${u.id}')"><span class="dot"></span>${escapeHtml(u.username)}</div>`).join(''):`<div class="user muted">Никого не найдено</div>`}
async function openChat(id){let u=allUsers.find(x=>x.id===id);if(!u)return;current=u.username;$('chathead').textContent='💬 '+current;$('text').disabled=false;$('send').disabled=false;$('messages').innerHTML='';let {data:{user}}=await sb.auth.getUser();let {data,error}=await sb.from('messages').select('id,sender_id,receiver_id,body,created_at').or(`and(sender_id.eq.${user.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${user.id})`).order('id');if(error){alert(error.message);return}data.forEach(render);scroll();renderUsers()}
function render(m){let d=document.createElement('div');d.className='msg '+(m.sender_id===myId?'mine':'');d.innerHTML=`<div class="bubble">${escapeHtml(m.body)}<div class="time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`;$('messages').appendChild(d)}
let myId='';async function getMyId(){if(myId)return myId;myId=(await sb.auth.getUser()).data.user.id;return myId}
async function send(e){e.preventDefault();if(!current)return;let x=$('text'),b=x.value.trim();if(!b)return;let u=allUsers.find(x=>x.username===current);if(!u)return;let {error}=await sb.from('messages').insert({sender_id:await getMyId(),receiver_id:u.id,body:b});if(error)alert(error.message);else x.value=''}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('private-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async payload=>{let m=payload.new,id=await getMyId();if((m.sender_id===id||m.receiver_id===id)&&((m.sender_id===id&&allUsers.some(u=>u.id===m.receiver_id&&u.username===current))||(m.receiver_id===id&&allUsers.some(u=>u.id===m.sender_id&&u.username===current)))){render(m);scroll()}}).subscribe()}
async function logout(){await sb.auth.signOut();location.reload()}
function scroll(){$('messages').scrollTop=$('messages').scrollHeight}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function boot(){if(SUPABASE_URL.startsWith('PASTE_')){$('config').innerHTML='Сначала подключи Supabase по инструкции.';return}let {data:{session}}=await sb.auth.getSession();if(session)await start(session)}
boot();
</script></body></html>
