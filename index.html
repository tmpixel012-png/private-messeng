<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Private Messeng</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:#f5f7fb;
  font-family:Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.card{
  width:min(390px,100%);
  background:#151c2e;
  padding:26px;
  border-radius:20px;
  box-shadow:0 15px 50px #0005;
}

h1{
  margin:0 0 5px;
}

.muted{
  color:#8e99ae;
  font-size:14px;
}

.card input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:11px;
  border:1px solid #303b55;
  background:#0e1525;
  color:#fff;
  outline:none;
}

.card button,
.send{
  background:#3b82f6;
  color:#fff;
  border:0;
  border-radius:11px;
  padding:13px;
  margin-top:10px;
  font-weight:bold;
}

.card button{
  width:100%;
}

.err{
  color:#ff8c8c;
  min-height:20px;
  margin-top:10px;
  font-size:13px;
}

.switch{
  margin-top:14px;
  text-align:center;
  color:#9ba6ba;
  font-size:14px;
}

.switch b{
  color:#75a7ff;
  cursor:pointer;
}

.app{
  height:100dvh;
  display:flex;
  max-width:1100px;
  margin:auto;
  background:#101827;
}

.users{
  width:300px;
  border-right:1px solid #273149;
  display:flex;
  flex-direction:column;
}

.head{
  padding:17px;
  border-bottom:1px solid #273149;
  font-weight:bold;
}

.search{
  padding:10px;
}

.search input{
  width:100%;
  background:#151e30;
  border:1px solid #303b55;
  color:#fff;
  border-radius:10px;
  padding:10px;
}

.list{
  overflow:auto;
}

.user{
  padding:14px 16px;
  border-bottom:1px solid #202a3e;
  cursor:pointer;
}

.user:hover,
.user.active{
  background:#1b2740;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#36d17c;
  margin-right:8px;
}

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chathead{
  padding:17px;
  border-bottom:1px solid #273149;
  font-weight:bold;
}

.messages{
  flex:1;
  overflow:auto;
  padding:18px;
}

.msg{
  margin:9px 0;
  display:flex;
}

.msg.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:min(75%,520px);
  background:#202b40;
  padding:9px 12px;
  border-radius:14px;
  overflow-wrap:anywhere;
}

.mine .bubble{
  background:#2f64c7;
}

.time{
  font-size:10px;
  color:#aab5c8;
  margin-top:4px;
}

.composer{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #273149;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
}

.composer input{
  flex:1;
  background:#151e30;
  border:1px solid #303b55;
  color:#fff;
  border-radius:12px;
  padding:12px;
  min-width:0;
  outline:none;
}

.send{
  margin:0;
  padding:12px 17px;
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.empty{
  margin:auto;
  color:#858fa4;
  text-align:center;
}

.logout{
  margin:0 12px 12px;
  padding:10px;
  background:#202a3e;
  color:#fff;
  border:0;
  border-radius:9px;
}

.hide{
  display:none!important;
}

@media(max-width:650px){
  .users{
    width:125px;
  }

  .user{
    padding:14px 8px;
    font-size:12px;
  }

  .head{
    padding:15px 8px;
    font-size:13px;
  }

  .search{
    padding:6px;
  }

  .search input{
    font-size:11px;
  }

  .bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<div id="auth" class="auth">
  <div class="card">

    <h1>🔒 Private Messeng</h1>
    <div class="muted">Простой мессенджер для своих</div>

    <div id="login">

      <input
        id="lu"
        autocomplete="username"
        placeholder="Имя пользователя"
      >

      <input
        id="lp"
        autocomplete="current-password"
        type="password"
        placeholder="Пароль"
      >

      <button type="button" onclick="doLogin()">
        Войти
      </button>

      <div class="switch">
        Нет аккаунта?
        <b onclick="toggle()">Создать</b>
      </div>

    </div>

    <div id="reg" class="hide">

      <input
        id="ru"
        autocomplete="username"
        placeholder="Имя пользователя"
      >

      <input
        id="rp"
        autocomplete="new-password"
        type="password"
        placeholder="Пароль (от 4 символов)"
      >

      <button type="button" onclick="doReg()">
        Создать аккаунт
      </button>

      <div class="switch">
        Уже есть аккаунт?
        <b onclick="toggle()">Войти</b>
      </div>

    </div>

    <div id="err" class="err"></div>

  </div>
</div>


<div id="app" class="app hide">

  <aside class="users">

    <div class="head">
      👥 Люди
    </div>

    <div class="search">
      <input
        id="search"
        placeholder="Поиск"
        oninput="renderUsers()"
      >
    </div>

    <div id="list" class="list"></div>

    <button
      type="button"
      class="logout"
      onclick="logout()"
    >
      Выйти
    </button>

  </aside>


  <section class="chat">

    <div id="chathead" class="chathead">
      Выберите человека
    </div>

    <div id="messages" class="messages">
      <div class="empty">
        Выберите человека слева
      </div>
    </div>

    <div class="composer">

      <input
        id="text"
        placeholder="Сообщение..."
        disabled
        autocomplete="off"
      >

      <button
        type="button"
        class="send"
        id="send"
        disabled
        onclick="send()"
      >
        ➤
      </button>

    </div>

  </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://ukutofgxcdsnpjftloxb.supabase.co';

const SUPABASE_ANON_KEY =
'sb_publishable_uuNwzGKCKd99_kM89BND1Q_SgWKjc2t';

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


let me = null;
let myId = '';
let current = null;
let allUsers = [];
let channel = null;


const $ = id =>
document.getElementById(id);


function toggle(){

  $('login').classList.toggle('hide');
  $('reg').classList.toggle('hide');
  $('err').textContent = '';

}


function msgError(e){

  $('err').textContent =
    e?.message || 'Произошла ошибка';

}


function validName(x){

  return /^[a-zA-Zа-яА-ЯёЁ0-9_-]{2,24}$/.test(x);

}


function emailFor(username){

  const bytes =
    new TextEncoder().encode(
      username.toLowerCase()
    );

  const hex =
    Array.from(
      bytes,
      b => b.toString(16).padStart(2,'0')
    ).join('');

  return 'u' + hex + '@private-messeng.local';

}


async function doReg(){

  try{

    const username =
      $('ru').value.trim();

    const password =
      $('rp').value;

    if(!validName(username)){
      throw Error(
        'Имя: 2–24 символа, без пробелов'
      );
    }

    if(password.length < 4){
      throw Error(
        'Пароль минимум 4 символа'
      );
    }

    const email =
      emailFor(username);

    const {data,error} =
      await sb.auth.signUp({
        email,
        password,
        options:{
          data:{
            username
          }
        }
      });

    if(error){
      throw error;
    }

    if(!data.session){

      throw Error(
        'В Supabase нужно отключить подтверждение email'
      );

    }

    await start(data.session);

  }catch(e){

    msgError(e);

  }

}


async function doLogin(){

  try{

    const username =
      $('lu').value.trim();

    const password =
      $('lp').value;

    if(!validName(username)){

      throw Error(
        'Проверь имя пользователя'
      );

    }

    const email =
      emailFor(username);

    const {data,error} =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(error){

      throw Error(
        'Неверное имя или пароль'
      );

    }

    await start(data.session);

  }catch(e){

    msgError(e);

  }

}


async function start(session){

  if(!session){
    return;
  }

  const {
    data:{
      user
    },
    error
  } =
  await sb.auth.getUser();

  if(error){
    throw error;
  }

  myId =
    user.id;

  me =
    user.user_metadata.username || '';

  $('auth')
    .classList
    .add('hide');

  $('app')
    .classList
    .remove('hide');

  await loadUsers();

  subscribe();

}


async function loadUsers(){

  const {
    data,
    error
  } =
  await sb
    .from('profiles')
    .select('id,username')
    .order('username');

  if(error){

    msgError(error);

    return;

  }

  allUsers =
    (data || [])
      .filter(x => x.id !== myId);

  renderUsers();

}


function renderUsers(){

  const q =
    $('search')
      .value
      .trim()
      .toLowerCase();

  const list =
    allUsers.filter(u =>
      u.username
        .toLowerCase()
        .includes(q)
    );

  $('list').innerHTML =
    list.length

    ?

    list.map(u => `

      <div
        class="user ${u.username === current ? 'active' : ''}"
        onclick="openChat('${u.id}')"
      >

        <span class="dot"></span>

        ${escapeHtml(u.username)}

      </div>

    `).join('')

    :

    `<div class="user muted">
      Никого не найдено
    </div>`;

}


async function openChat(id){

  const u =
    allUsers.find(
      x => x.id === id
    );

  if(!u){
    return;
  }

  current =
    u.username;

  $('chathead').textContent =
    '💬 ' + current;

  $('text').disabled =
    false;

  $('send').disabled =
    false;

  $('messages').innerHTML = '';


  const {
    data,
    error
  } =
  await sb
    .from('messages')
    .select(
      'id,sender_id,receiver_id,body,created_at'
    )
    .or(
      `and(sender_id.eq.${myId},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${myId})`
    )
    .order('created_at');


  if(error){

    alert(
      'Ошибка загрузки чата: ' +
      error.message
    );

    return;

  }


  data.forEach(render);

  scroll();

  renderUsers();

}


function render(m){

  const d =
    document.createElement('div');

  d.className =
    'msg ' +
    (m.sender_id === myId
      ? 'mine'
      : '');

  d.innerHTML = `

    <div class="bubble">

      ${escapeHtml(m.body)}

      <div class="time">

        ${new Date(
          m.created_at
        ).toLocaleTimeString(
          [],
          {
            hour:'2-digit',
            minute:'2-digit'
          }
        )}

      </div>

    </div>

  `;

  $('messages')
    .appendChild(d);

}


async function send(){

  if(!current || !myId){
    return;
  }


  const input =
    $('text');

  const body =
    input.value.trim();

  if(!body){
    return;
  }


  const u =
    allUsers.find(
      x => x.username === current
    );

  if(!u){
    return;
  }


  /*
    Проверяем, что пользователь
    действительно всё ещё авторизован.
  */

  const {
    data:{
      session
    }
  } =
  await sb.auth.getSession();


  if(!session){

    alert(
      'Сессия входа пропала. Обнови страницу и войди снова.'
    );

    return;

  }


  const button =
    $('send');

  button.disabled =
    true;


  try{

    const {
      error
    } =
    await sb
      .from('messages')
      .insert({

        sender_id:
          myId,

        receiver_id:
          u.id,

        body:
          body

      });


    if(error){

      console.error(
        'SEND ERROR:',
        error
      );

      alert(
        'Ошибка отправки: ' +
        error.message
      );

      return;

    }


    input.value = '';

    /*
      Сразу показываем сообщение,
      даже если Realtime ещё не успел.
    */

    const now =
      new Date().toISOString();

    render({

      sender_id:
        myId,

      receiver_id:
        u.id,

      body:
        body,

      created_at:
        now

    });

    scroll();


  }catch(e){

    console.error(
      'SEND ERROR:',
      e
    );

    alert(
      'Ошибка отправки: ' +
      (e.message || e)
    );

  }finally{

    button.disabled =
      false;

    input.focus();

  }

}


function subscribe(){

  if(channel){

    sb.removeChannel(
      channel
    );

  }


  channel =
    sb
      .channel('private-messages')

      .on(
        'postgres_changes',

        {
          event:'INSERT',
          schema:'public',
          table:'messages'
        },

        payload => {

          const m =
            payload.new;

          if(
            m.sender_id === myId ||
            m.receiver_id === myId
          ){

            const other =
              m.sender_id === myId
                ? m.receiver_id
                : m.sender_id;


            const u =
              allUsers.find(
                x => x.id === other
              );


            if(
              u &&
              u.username === current &&
              m.sender_id !== myId
            ){

              render(m);

              scroll();

            }

          }

        }

      )

      .subscribe();

}


async function logout(){

  await sb.auth.signOut();

  location.reload();

}


function scroll(){

  const box =
    $('messages');

  box.scrollTop =
    box.scrollHeight;

}


function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,

    c => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[c])

  );

}


/*
  Enter = отправить сообщение
*/

$('text').addEventListener(
  'keydown',
  e => {

    if(
      e.key === 'Enter' &&
      !e.shiftKey
    ){

      e.preventDefault();

      send();

    }

  }
);


/*
  Проверяем существующую
  авторизацию при открытии сайта.
*/

async function boot(){

  try{

    const {
      data:{
        session
      }
    } =
    await sb.auth.getSession();


    if(session){

      await start(session);

    }

  }catch(e){

    console.error(
      'BOOT ERROR:',
      e
    );

  }

}


boot();

</script>

</body>
  </html>
