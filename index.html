<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151a27"><title>Private Messeng</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1118;color:#f5f7fb;font-family:Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(380px,100%);background:#171c28;padding:25px;border-radius:18px}
.card h1{margin:0 0 5px}.muted{color:#8d96a8;font-size:14px}.card input{width:100%;padding:13px;margin-top:9px;border-radius:10px;border:1px solid #30384b;background:#0f131d;color:#fff}
.card button,.send{background:#3578f6;color:#fff;border:0;border-radius:10px;padding:13px;margin-top:9px;font-weight:bold}.card button{width:100%}.err{color:#ff8585;min-height:20px;margin-top:10px;font-size:13px}.switch{margin-top:14px;text-align:center;color:#9ba4b6;font-size:14px}.switch b{color:#72a2ff;cursor:pointer}
.app{height:100vh;display:flex;max-width:1000px;margin:auto;background:#111620}.users{width:280px;border-right:1px solid #272e3c;display:flex;flex-direction:column}.head{padding:18px;border-bottom:1px solid #272e3c;font-weight:bold}.user{padding:14px 16px;border-bottom:1px solid #202735;cursor:pointer}.user:hover,.user.active{background:#1d2637}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d17c;margin-right:8px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}.chathead{padding:18px;border-bottom:1px solid #272e3c;font-weight:bold}.messages{flex:1;overflow:auto;padding:18px}.msg{margin:9px 0;display:flex}.msg.mine{justify-content:flex-end}.bubble{max-width:min(70%,500px);background:#202838;padding:9px 12px;border-radius:14px}.mine .bubble{background:#2d61c7}.time{font-size:10px;color:#aab2c0;margin-top:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #272e3c}.composer input{flex:1;background:#181e2a;border:1px solid #30384b;color:#fff;border-radius:12px;padding:12px}.send{margin:0;padding:12px 17px}
.empty{margin:auto;color:#858ea0;text-align:center}.logout{margin:0 12px 12px;padding:10px;background:#202636;color:#fff;border:0;border-radius:9px}
@media(max-width:650px){.users{width:100px}.user{padding:14px 8px;font-size:12px}.head{padding:15px 8px;font-size:13px}.bubble{max-width:85%}}
.hide{display:none!important}
</style></head>
<body>
<div id="auth" class="auth"><div class="card">
<h1>🔒 Private Messeng</h1><div class="muted">Простой мессенджер для своих</div>
<div id="login"><input id="lu" placeholder="Имя"><input id="lp" type="password" placeholder="Пароль"><button onclick="doLogin()">Войти</button><div class="switch">Нет аккаунта? <b onclick="toggle()">Создать</b></div></div>
<div id="reg" class="hide"><input id="ru" placeholder="Имя"><input id="rp" type="password" placeholder="Пароль"><button onclick="doReg()">Создать аккаунт</button><div class="switch">Уже есть аккаунт? <b onclick="toggle()">Войти</b></div></div>
<div id="err" class="err"></div></div></div>

<div id="app" class="app hide"><aside class="users"><div class="head">👥 Чаты</div><div id="list"></div><button class="logout" onclick="logout()">Выйти</button></aside>
<section class="chat"><div id="chathead" class="chathead">Выберите человека</div><div id="messages" class="messages"><div class="empty">Выберите чат слева</div></div>
<form class="composer" onsubmit="send(event)"><input id="text" placeholder="Сообщение..." disabled><button class="send" id="send" disabled>➤</button></form></section></div>

<script src="/socket.io/socket.io.js"></script><script>
let token=localStorage.getItem("tm_token"),me=localStorage.getItem("tm_user"),current=null,socket;
const $=x=>document.getElementById(x);
async function api(u,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}
function toggle(){$("login").classList.toggle("hide");$("reg").classList.toggle("hide");$("err").textContent=""}
async function doLogin(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({username:$("lu").value,password:$("lp").value})});start(d)}catch(e){$("err").textContent=e.message}}
async function doReg(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({username:$("ru").value,password:$("rp").value})});start(d)}catch(e){$("err").textContent=e.message}}
function start(d){token=d.token;me=d.username;localStorage.setItem("tm_token",token);localStorage.setItem("tm_user",me);$("auth").classList.add("hide");$("app").classList.remove("hide");socket=io();socket.emit("identify",token);socket.on("message",m=>{if(m.sender===current||m.receiver===current){render(m);scroll()}});loadUsers()}
async function loadUsers(){let us=await api("/api/users");$("list").innerHTML=us.length?us.map(u=>`<div class="user" onclick="openChat('${encodeURIComponent(u.username)}')"><span class="dot"></span>${escapeHtml(u.username)}</div>`).join(""):`<div class="user muted">Пока никого нет</div>`}
async function openChat(enc){current=decodeURIComponent(enc);$("chathead").textContent="💬 "+current;$("text").disabled=false;$("send").disabled=false;$("messages").innerHTML="";let ms=await api("/api/messages/"+encodeURIComponent(current));ms.forEach(render);scroll()}
function render(m){let d=document.createElement("div");d.className="msg "+(m.sender===me?"mine":"");d.innerHTML=`<div class="bubble">${escapeHtml(m.body)}<div class="time">${new Date(m.created).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div></div>`;$("messages").appendChild(d)}
async function send(e){e.preventDefault();if(!current)return;let x=$("text"),b=x.value.trim();if(!b)return;try{await api("/api/messages",{method:"POST",body:JSON.stringify({receiver:current,body:b})});x.value=""}catch(e){alert(e.message)}}
function scroll(){$("messages").scrollTop=$("messages").scrollHeight}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function logout(){localStorage.clear();location.reload()}
if(token){api("/api/users").then(()=>start({token,username:me})).catch(()=>localStorage.clear())}
</script></body></html>
