<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Private Messeng</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:#f5f7fb;
  font-family:Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.card{
  width:min(390px,100%);
  background:#151c2e;
  padding:26px;
  border-radius:20px;
  box-shadow:0 15px 50px #0005;
}

h1{
  margin:0 0 5px;
}

.muted{
  color:#8e99ae;
  font-size:14px;
}

.card input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:11px;
  border:1px solid #303b55;
  background:#0e1525;
  color:#fff;
  outline:none;
}

.card button,
.send{
  background:#3b82f6;
  color:#fff;
  border:0;
  border-radius:11px;
  padding:13px;
  margin-top:10px;
  font-weight:bold;
}

.card button{
  width:100%;
}

.err{
  color:#ff8c8c;
  min-height:20px;
  margin-top:10px;
  font-size:13px;
}

.switch{
  margin-top:14px;
  text-align:center;
  color:#9ba6ba;
  font-size:14px;
}

.switch b{
  color:#75a7ff;
  cursor:pointer;
}

.app{
  height:100dvh;
  display:flex;
  max-width:1100px;
  margin:auto;
  background:#101827;
}

.users{
  width:300px;
  border-right:1px solid #273149;
  display:flex;
  flex-direction:column;
}

.head{
  padding:17px;
  border-bottom:1px solid #273149;
  font-weight:bold;
}

.search{
  padding:10px;
}

.search input{
  width:100%;
  background:#151e30;
  border:1px solid #303b55;
  color:#fff;
  border-radius:10px;
  padding:10px;
}

.list{
  overflow:auto;
  flex:1;
}

.user{
  padding:14px 16px;
  border-bottom:1px solid #202a3e;
  cursor:pointer;
}

.user:hover,
.user.active{
  background:#1b2740;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#36d17c;
  margin-right:8px;
}

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chathead{
  padding:17px;
  border-bottom:1px solid #273149;
  font-weight:bold;
}

.messages{
  flex:1;
  overflow:auto;
  padding:18px;
}

.msg{
  margin:9px 0;
  display:flex;
}

.msg.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:min(75%,520px);
  background:#202b40;
  padding:9px 12px;
  border-radius:14px;
  overflow-wrap:anywhere;
}

.mine .bubble{
  background:#2f64c7;
}

.time{
  font-size:10px;
  color:#aab5c8;
  margin-top:4px;
}

.composer{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #273149;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  align-items:center;
}

.composer input{
  flex:1;
  background:#151e30;
  border:1px solid #303b55;
  color:#fff;
  border-radius:12px;
  padding:12px;
  min-width:0;
  outline:none;
}

.send{
  margin:0;
  padding:12px 17px;
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.attach{
  width:44px;
  height:44px;
  border:0;
  border-radius:12px;
  background:#202a3e;
  color:#fff;
  font-size:20px;
  flex-shrink:0;
}

.record{
  width:44px;
  height:44px;
  border:0;
  border-radius:12px;
  background:#202a3e;
  color:#fff;
  font-size:20px;
  flex-shrink:0;
}

.record.recording{
  background:#dc2626;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    opacity:.55;
  }
}

.file-card{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.file-name{
  font-weight:bold;
  word-break:break-word;
}

.file-size{
  color:#b8c2d3;
  font-size:12px;
}

.file-link{
  display:inline-block;
  color:#fff;
  background:#ffffff22;
  padding:7px 10px;
  border-radius:8px;
  text-decoration:none;
  width:max-content;
}

.chat-image{
  display:block;
  max-width:100%;
  max-height:320px;
  border-radius:10px;
  object-fit:contain;
  background:#0003;
}

.audio-player{
  width:100%;
  min-width:220px;
}

.upload-status{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#111827;
  border:1px solid #34405b;
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  z-index:100;
  box-shadow:0 10px 30px #0007;
  display:none;
  max-width:90%;
  text-align:center;
}

.upload-status.show{
  display:block;
}

.empty{
  margin:auto;
  color:#858fa4;
  text-align:center;
}

.logout{
  margin:12px;
  padding:10px;
  background:#202a3e;
  color:#fff;
  border:0;
  border-radius:9px;
}

.hide{
  display:none!important;
}

@media(max-width:650px){

  .users{
    width:125px;
  }

  .user{
    padding:14px 8px;
    font-size:12px;
  }

  .head{
    padding:15px 8px;
    font-size:13px;
  }

  .search{
    padding:6px;
  }

  .search input{
    font-size:11px;
  }

  .bubble{
    max-width:88%;
  }

  .composer{
    gap:5px;
  }

  .attach,
  .record{
    width:40px;
    height:40px;
    font-size:18px;
  }

  .send{
    padding:11px 13px;
  }
}
</style>
</head>

<body>

<div id="auth" class="auth">

  <div class="card">

    <h1>🔒 Private Messeng</h1>

    <div class="muted">
      Простой мессенджер для своих
    </div>

    <div id="login">

      <input
        id="lu"
        autocomplete="username"
        placeholder="Имя пользователя"
      >

      <input
        id="lp"
        autocomplete="current-password"
        type="password"
        placeholder="Пароль"
      >

      <button type="button" onclick="doLogin()">
        Войти
      </button>

      <div class="switch">
        Нет аккаунта?
        <b onclick="toggle()">Создать</b>
      </div>

    </div>

    <div id="reg" class="hide">

      <input
        id="ru"
        autocomplete="username"
        placeholder="Имя пользователя"
      >

      <input
        id="rp"
        autocomplete="new-password"
        type="password"
        placeholder="Пароль (от 4 символов)"
      >

      <button type="button" onclick="doReg()">
        Создать аккаунт
      </button>

      <div class="switch">
        Уже есть аккаунт?
        <b onclick="toggle()">Войти</b>
      </div>

    </div>

    <div id="err" class="err"></div>

  </div>

</div>


<div id="app" class="app hide">

  <aside class="users">

    <div class="head">
      👥 Люди
    </div>

    <div class="search">
      <input
        id="search"
        placeholder="Поиск"
        oninput="renderUsers()"
      >
    </div>

    <div id="list" class="list"></div>

    <button
      type="button"
      class="logout"
      onclick="logout()"
    >
      Выйти
    </button>

  </aside>


  <section class="chat">

    <div id="chathead" class="chathead">
      Выберите человека
    </div>

    <div id="messages" class="messages">
      <div class="empty">
        Выберите человека слева
      </div>
    </div>


    <div class="composer">

      <input
        id="text"
        placeholder="Сообщение..."
        disabled
        autocomplete="off"
      >

      <input
        id="fileInput"
        class="file-input"
        type="file"
        accept="image/*,audio/*,.pdf,.zip,.rar,.txt,.doc,.docx,.xls,.xlsx,.7z"
        onchange="uploadFile(this.files[0])"
      >

      <button
        type="button"
        class="attach"
        id="attach"
        disabled
        onclick="document.getElementById('fileInput').click()"
      >
        📎
      </button>

      <button
        type="button"
        class="record"
        id="record"
        disabled
        onclick="toggleRecording()"
      >
        🎙️
      </button>

      <button
        type="button"
        class="send"
        id="send"
        disabled
        onclick="send()"
      >
        ➤
      </button>

    </div>

  </section>

</div>


<div id="uploadStatus" class="upload-status">
  Загрузка...
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://ukutofgxcdsnpjftloxb.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_uuNwzGKCKd99_kM89BND1Q_SgWKjc2t';

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ВАЖНО: твой приватный bucket */
const BUCKET = 'attachments';


let me = null;
let myId = '';
let current = null;
let allUsers = [];
let channel = null;

let mediaRecorder = null;
let audioChunks = [];
let recordingStream = null;


const $ = id => document.getElementById(id);


function toggle(){

  $('login').classList.toggle('hide');
  $('reg').classList.toggle('hide');
  $('err').textContent = '';

}


function msgError(e){

  $('err').textContent =
    e?.message || 'Произошла ошибка';

}


function validName(x){

  return /^[a-zA-Zа-яА-ЯёЁ0-9_-]{2,24}$/.test(x);

}


function emailFor(username){

  const bytes =
    new TextEncoder().encode(
      username.toLowerCase()
    );

  const hex =
    Array.from(
      bytes,
      b => b.toString(16).padStart(2,'0')
    ).join('');

  return 'u' +
    hex +
    '@private-messeng.local';

}


async function doReg(){

  try{

    const username =
      $('ru').value.trim();

    const password =
      $('rp').value;

    if(!validName(username))
      throw Error(
        'Имя: 2–24 символа, без пробелов'
      );

    if(password.length < 4)
      throw Error(
        'Пароль минимум 4 символа'
      );

    const email =
      emailFor(username);

    const {data,error} =
      await sb.auth.signUp({
        email,
        password,
        options:{
          data:{
            username
          }
        }
      });

    if(error)
      throw error;

    if(!data.session)
      throw Error(
        'В Supabase нужно отключить подтверждение email'
      );

    await start(data.session);

  }catch(e){

    msgError(e);

  }

}


async function doLogin(){

  try{

    const username =
      $('lu').value.trim();

    const password =
      $('lp').value;

    if(!validName(username))
      throw Error(
        'Проверь имя пользователя'
      );

    const email =
      emailFor(username);

    const {data,error} =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(error)
      throw Error(
        'Неверное имя или пароль'
      );

    await start(data.session);

  }catch(e){

    msgError(e);

  }

}


async function start(session){

  if(!session)
    return;

  const {
    data:{
      user
    },
    error
  } = await sb.auth.getUser();

  if(error)
    throw error;

  myId =
    user.id;

  me =
    user.user_metadata.username || '';

  $('auth').classList.add('hide');
  $('app').classList.remove('hide');

  await loadUsers();

  subscribe();

}


async function loadUsers(){

  const {
    data,
    error
  } =
    await sb
      .from('profiles')
      .select('id,username')
      .order('username');

  if(error){

    msgError(error);
    return;

  }

  allUsers =
    (data || [])
      .filter(
        x => x.id !== myId
      );

  renderUsers();

}


function renderUsers(){

  const q =
    $('search')
      .value
      .trim()
      .toLowerCase();

  const list =
    allUsers.filter(
      u =>
        u.username
          .toLowerCase()
          .includes(q)
    );

  $('list').innerHTML =
    list.length
      ?
      list.map(
        u =>
          `<div
            class="user ${u.username === current ? 'active' : ''}"
            onclick="openChat('${u.id}')"
          >
            <span class="dot"></span>
            ${escapeHtml(u.username)}
          </div>`
      ).join('')
      :
      `<div class="user muted">
        Никого не найдено
      </div>`;

}


async function openChat(id){

  const u =
    allUsers.find(
      x => x.id === id
    );

  if(!u)
    return;

  current =
    u.username;

  $('chathead').textContent =
    '💬 ' + current;

  $('text').disabled = false;
  $('send').disabled = false;
  $('attach').disabled = false;
  $('record').disabled = false;

  $('messages').innerHTML = '';

  const {
    data,
    error
  } =
    await sb
      .from('messages')
      .select(
        'id,sender_id,receiver_id,body,created_at'
      )
      .or(
        `and(sender_id.eq.${myId},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${myId})`
      )
      .order('created_at');

  if(error){

    alert(
      'Ошибка загрузки чата: ' +
      error.message
    );

    return;

  }

  for(const m of data || []){

    await render(m);

  }

  scroll();

  renderUsers();

}


async function render(m){

  const d =
    document.createElement('div');

  d.className =
    'msg ' +
    (m.sender_id === myId
      ? 'mine'
      : '');

  const bubble =
    document.createElement('div');

  bubble.className =
    'bubble';

  const content =
    await makeMessageContent(
      m.body
    );

  bubble.appendChild(
    content
  );

  const time =
    document.createElement('div');

  time.className =
    'time';

  time.textContent =
    new Date(
      m.created_at
    ).toLocaleTimeString(
      [],
      {
        hour:'2-digit',
        minute:'2-digit'
      }
    );

  bubble.appendChild(
    time
  );

  d.appendChild(
    bubble
  );

  $('messages').appendChild(
    d
  );

}


async function makeMessageContent(body){

  if(
    typeof body === 'string' &&
    body.startsWith(
      '[[ATTACHMENT]]'
    )
  ){

    try{

      const attachment =
        JSON.parse(
          body.substring(
            '[[ATTACHMENT]]'.length
          )
        );

      return await createAttachmentElement(
        attachment
      );

    }catch(e){

      console.error(
        'ATTACHMENT ERROR:',
        e
      );

    }

  }


  const text =
    document.createElement('div');

  text.textContent =
    body;

  return text;

}


async function createAttachmentElement(a){

  const box =
    document.createElement('div');

  box.className =
    'file-card';

  let url = '';

  try{

    const result =
      await sb.storage
        .from(BUCKET)
        .createSignedUrl(
          a.path,
          3600
        );

    if(result.error)
      throw result.error;

    url =
      result.data.signedUrl;

  }catch(e){

    console.error(
      'SIGNED URL ERROR:',
      e
    );

    const error =
      document.createElement('div');

    error.textContent =
      'Не удалось открыть файл';

    box.appendChild(
      error
    );

    return box;

  }


  if(a.type === 'image'){

    const img =
      document.createElement('img');

    img.className =
      'chat-image';

    img.src =
      url;

    img.alt =
      a.name || 'Фото';

    img.loading =
      'lazy';

    box.appendChild(
      img
    );


    const link =
      document.createElement('a');

    link.className =
      'file-link';

    link.href =
      url;

    link.target =
      '_blank';

    link.rel =
      'noopener';

    link.textContent =
      '🖼️ Открыть фото';

    box.appendChild(
      link
    );


  }else if(a.type === 'audio'){

    const audio =
      document.createElement('audio');

    audio.className =
      'audio-player';

    audio.controls =
      true;

    audio.src =
      url;

    box.appendChild(
      audio
    );


  }else{

    const name =
      document.createElement('div');

    name.className =
      'file-name';

    name.textContent =
      '📄 ' +
      (a.name || 'Файл');

    box.appendChild(
      name
    );


    const size =
      document.createElement('div');

    size.className =
      'file-size';

    size.textContent =
      formatSize(
        a.size || 0
      );

    box.appendChild(
      size
    );


    const link =
      document.createElement('a');

    link.className =
      'file-link';

    link.href =
      url;

    link.target =
      '_blank';

    link.rel =
      'noopener';

    link.download =
      a.name || 'file';

    link.textContent =
      '📥 Скачать';

    box.appendChild(
      link
    );

  }


  return box;

}


async function send(){

  if(!current || !myId)
    return;

  const input =
    $('text');

  const body =
    input.value.trim();

  if(!body)
    return;

  const u =
    allUsers.find(
      x => x.username === current
    );

  if(!u)
    return;

  const {
    data:{
      session
    }
  } =
    await sb.auth.getSession();

  if(!session){

    alert(
      'Сессия входа пропала. Обнови страницу и войди снова.'
    );

    return;

  }

  const button =
    $('send');

  button.disabled =
    true;

  try{

    const {
      error
    } =
      await sb
        .from('messages')
        .insert({
          sender_id:myId,
          receiver_id:u.id,
          body:body
        });

    if(error){

      console.error(
        'SEND ERROR:',
        error
      );

      alert(
        'Ошибка отправки: ' +
        error.message
      );

      return;

    }

    input.value = '';

    await render({
      sender_id:myId,
      receiver_id:u.id,
      body:body,
      created_at:
        new Date().toISOString()
    });

    scroll();

  }catch(e){

    console.error(
      'SEND ERROR:',
      e
    );

    alert(
      'Ошибка отправки: ' +
      (e.message || e)
    );

  }finally{

    button.disabled =
      false;

    input.focus();

  }

}


async function uploadFile(file){

  if(!file)
    return;

  if(!current){

    alert(
      'Сначала выбери человека'
    );

    $('fileInput').value = '';

    return;

  }


  const u =
    allUsers.find(
      x => x.username === current
    );

  if(!u){

    $('fileInput').value = '';

    return;

  }


  const MAX_SIZE =
    50 * 1024 * 1024;

  if(file.size > MAX_SIZE){

    alert(
      'Файл слишком большой. Максимум 50 МБ.'
    );

    $('fileInput').value = '';

    return;

  }


  try{

    showUpload(
      '⏳ Загружаю файл...'
    );


    const extension =
      getExtension(
        file.name
      );


    const safeName =
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .substring(2,10) +
      extension;


    const path =
      myId +
      '/' +
      safeName;


    const {
      error
    } =
      await sb.storage
        .from(BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl:'3600',
            upsert:false,
            contentType:
              file.type ||
              'application/octet-stream'
          }
        );


    if(error)
      throw error;


    let type =
      'file';


    if(
      file.type &&
      file.type.startsWith(
        'image/'
      )
    ){

      type =
        'image';

    }else if(
      file.type &&
      file.type.startsWith(
        'audio/'
      )
    ){

      type =
        'audio';

    }


    const attachment = {

      type:type,

      name:file.name,

      size:file.size,

      mime:file.type,

      path:path

    };


    const body =
      '[[ATTACHMENT]]' +
      JSON.stringify(
        attachment
      );


    const {
      error:messageError
    } =
      await sb
        .from('messages')
        .insert({
          sender_id:myId,
          receiver_id:u.id,
          body:body
        });


    if(messageError)
      throw messageError;


    await render({

      sender_id:myId,

      receiver_id:u.id,

      body:body,

      created_at:
        new Date().toISOString()

    });


    scroll();


    showUpload(
      '✅ Файл отправлен'
    );


    setTimeout(
      hideUpload,
      1200
    );


  }catch(e){

    console.error(
      'UPLOAD ERROR:',
      e
    );

    hideUpload();

    alert(
      'Ошибка загрузки: ' +
      (e.message || e)
    );

  }


  $('fileInput').value = '';

}


async function toggleRecording(){

  if(mediaRecorder){

    if(
      mediaRecorder.state ===
      'recording'
    ){

      mediaRecorder.stop();

    }
