<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Private Messeng</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f1117;
  color:#fff;
}

body{
  overflow:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

#authScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#222a3d 0,#0f1117 55%);
}

.authBox{
  width:100%;
  max-width:420px;
  background:#171a23;
  border:1px solid #292e3c;
  border-radius:22px;
  padding:28px;
  box-shadow:0 20px 70px rgba(0,0,0,.4);
}

.logo{
  font-size:30px;
  font-weight:800;
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  color:#9da5b8;
  text-align:center;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tab{
  flex:1;
  padding:12px;
  border:0;
  border-radius:12px;
  background:#222633;
  color:#aeb6c8;
}

.tab.active{
  background:#5865f2;
  color:white;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  color:#aab1c2;
  margin-bottom:6px;
}

.field input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #303646;
  background:#10131a;
  color:#fff;
  outline:none;
}

.field input:focus{
  border-color:#5865f2;
}

.primary{
  width:100%;
  border:0;
  padding:14px;
  border-radius:13px;
  background:#5865f2;
  color:#fff;
  font-weight:700;
  margin-top:5px;
}

.primary:disabled{
  opacity:.5;
}

.status{
  min-height:20px;
  color:#ff8b8b;
  text-align:center;
  font-size:13px;
  margin-top:12px;
}

#app{
  width:100%;
  height:100%;
  display:flex;
}

.sidebar{
  width:310px;
  min-width:310px;
  background:#151821;
  border-right:1px solid #292e39;
  display:flex;
  flex-direction:column;
}

.sidebarTop{
  padding:18px;
  border-bottom:1px solid #292e39;
}

.brand{
  font-size:21px;
  font-weight:800;
  margin-bottom:5px;
}

.currentUser{
  color:#929bad;
  font-size:13px;
  margin-bottom:15px;
}

.search{
  width:100%;
  padding:11px 12px;
  border:1px solid #303646;
  background:#0f1218;
  color:white;
  border-radius:11px;
  outline:none;
}

.users{
  flex:1;
  overflow:auto;
  padding:8px;
}

.user{
  padding:12px;
  border-radius:12px;
  margin-bottom:5px;
  cursor:pointer;
}

.user:hover{
  background:#202430;
}

.user.active{
  background:#29304a;
}

.userName{
  font-weight:700;
}

.userId{
  color:#777f91;
  font-size:11px;
  margin-top:3px;
}

.sidebarBottom{
  padding:12px;
  border-top:1px solid #292e39;
}

.secondary{
  width:100%;
  border:0;
  padding:11px;
  border-radius:11px;
  background:#242936;
  color:#ddd;
}

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.chatHeader{
  height:65px;
  min-height:65px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid #292e39;
  background:#151821;
}

.chatTitle{
  font-weight:800;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#70788a;
  text-align:center;
}

.messageRow{
  display:flex;
  margin-bottom:10px;
}

.messageRow.mine{
  justify-content:flex-end;
}

.message{
  max-width:min(75%,600px);
  padding:10px 13px;
  border-radius:15px;
  background:#202532;
  word-wrap:break-word;
}

.messageRow.mine .message{
  background:#3d4bc2;
}

.messageTime{
  margin-top:5px;
  font-size:10px;
  color:#aab1c0;
  text-align:right;
}

.messageText{
  white-space:pre-wrap;
}

.attachment{
  margin-top:8px;
  border-radius:10px;
  overflow:hidden;
}

.attachment img{
  max-width:100%;
  max-height:350px;
  display:block;
}

.attachment audio{
  width:100%;
  max-width:350px;
}

.fileLink{
  display:block;
  padding:10px;
  background:rgba(0,0,0,.2);
  color:#fff;
  text-decoration:none;
  border-radius:9px;
}

.composer{
  padding:12px;
  border-top:1px solid #292e39;
  background:#151821;
}

.attachPreview{
  color:#aeb5c4;
  font-size:12px;
  margin-bottom:8px;
  min-height:16px;
}

.composerRow{
  display:flex;
  gap:8px;
  align-items:flex-end;
}

.composer textarea{
  flex:1;
  min-height:45px;
  max-height:130px;
  resize:none;
  border:1px solid #303646;
  background:#0f1218;
  color:#fff;
  border-radius:12px;
  padding:12px;
  outline:none;
}

.iconBtn{
  width:45px;
  height:45px;
  border:0;
  border-radius:12px;
  background:#242936;
  color:white;
}

.sendBtn{
  width:55px;
  height:45px;
  border:0;
  border-radius:12px;
  background:#5865f2;
  color:white;
  font-weight:700;
}

.recording{
  background:#c93636!important;
}

#fileInput{
  display:none;
}

.mobileBack{
  display:none;
}

@media(max-width:750px){

  .sidebar{
    width:100%;
    min-width:0;
  }

  .chat{
    display:none;
  }

  #app.chatOpen .sidebar{
    display:none;
  }

  #app.chatOpen .chat{
    display:flex;
  }

  .mobileBack{
    display:block;
    margin-right:12px;
    border:0;
    background:transparent;
    color:white;
    font-size:22px;
  }

  .message{
    max-width:88%;
  }
}
</style>
</head>

<body>

<div id="authScreen">

  <div class="authBox">

    <div class="logo">Private Messeng</div>
    <div class="subtitle">Приватный мессенджер</div>

    <div class="tabs">
      <button id="loginTab" class="tab active">Вход</button>
      <button id="registerTab" class="tab">Регистрация</button>
    </div>

    <form id="authForm">

      <div class="field">
        <label>Имя пользователя</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          maxlength="30"
          required
          placeholder="Например: timblogplay"
        >

      <div class="field">
        <label>Пароль</label>

      <button id="authButton" class="primary" type="submit">

</div>


<div id="app" class="hidden">

  <aside class="sidebar">

    <div class="sidebarTop">

      <div class="brand">Private Messeng</div>

      <div id="currentUser" class="currentUser">
        Загрузка...

        id="searchInput"
        class="search"
        placeholder="Поиск пользователя..."

      <button id="logoutButton" class="secondary">
        Выйти

    </div>

  </aside>


  <main class="chat">

    <div class="chatHeader">

      <button id="mobileBack" class="mobileBack">
        ←
      </button>

      <div id="chatTitle" class="chatTitle">
        Выберите пользователя
      </div>

    </div>


    <div id="messages" class="messages">

      <div class="empty">
        Выберите пользователя слева,<br>
        чтобы начать общение.
      </div>

    <div class="composer">

      <div id="attachPreview" class="attachPreview"></div>

      <div class="composerRow">

        <button
          id="fileButton"
          class="iconBtn"
          title="Файл"
          type="button"
        >
          📎
        </button>

        <button
          id="recordButton"
          class="iconBtn"
          title="Голосовое сообщение"
          type="button"
        >
          🎤
        </button>

        <textarea
          id="messageInput"
          placeholder="Написать сообщение..."

        <button
          id="sendButton"
          class="sendBtn"
          type="button"

          ➤
        </button>

      </div>

        id="fileInput"
        type="file"
        accept="image/*,audio/*,.pdf,.zip,.rar,.txt,.doc,.docx,.xls,.xlsx,.7z"
      >

    </div>

  </main>

</div>


<script>
const SUPABASE_URL =
  "https://ukutofgxcdsnpjftloxb.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_uuNwzGKCKd99_kM89BND1Q_SgWKjc2t";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storage: window.localStorage,
      storageKey: "private-messeng-auth"
    }
  }
);


const state = {
  session: null,
  user: null,
  profile: null,
  selectedUser: null,
  messages: [],
  channel: null,
  attachment: null
};


let authMode = "login";
let booting = false;
let recorder = null;
let recorderChunks = [];
let recordingStream = null;


const $ = id => document.getElementById(id);


function normalizeUsername(value){
  return value
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"");
}


function authEmail(username){
  const normalized = normalizeUsername(username);

  let hash = 0;

  for(let i=0;i<normalized.length;i++){
    hash = ((hash << 5) - hash) + normalized.charCodeAt(i);
    hash |= 0;
  }

  const safe = Math.abs(hash).toString(16);

  return "u" + safe + "@private-messeng.local";
}


function setScreen(logged){
  $("authScreen").classList.toggle("hidden",logged);
  $("app").classList.toggle("hidden",!logged);
}


function setAuthStatus(text,error=true){
  $("authStatus").textContent = text || "";
  $("authStatus").style.color =
    error ? "#ff8b8b" : "#76e39b";
}


function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatTime(value){
  const date = new Date(value);

  return date.toLocaleTimeString(
    "ru-RU",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


async function ensureProfile(){

  if(!state.user){
    throw new Error("Нет пользователя");
  }

  const {data,error} = await db
    .from("profiles")
    .select("id,username")
    .eq("id",state.user.id)
    .maybeSingle();

  if(error){
    throw error;
  }

  if(data){
    return data;
  }

  const username =
    state.user.user_metadata?.username ||
    "user_" + state.user.id.slice(0,8);

  const {data:created,error:createError} =
    await db
      .from("profiles")
      .insert({
        id:state.user.id,
        username:username
      })
      .select("id,username")
      .single();

  if(createError){
    throw createError;
  }

  return created;
}


async function register(username,password){

  username = normalizeUsername(username);

  if(username.length < 3){
    throw new Error(
      "Имя пользователя должно содержать минимум 3 символа."
    );
  }

  if(!/^[a-z0-9_]+$/i.test(username)){
    throw new Error(
      "Используй только буквы, цифры и _."
    );
  }

  if(password.length < 6){
    throw new Error(
      "Пароль должен быть минимум 6 символов."
    );
  }


  const {data:existing,error:searchError} =
    await db
      .from("profiles")
      .select("id")
      .eq("username",username)
      .maybeSingle();

  if(searchError){
    throw searchError;
  }

  if(existing){
    throw new Error(
      "Такое имя пользователя уже занято."
    );
  }


  const email = authEmail(username);

  const {data,error} =
    await db.auth.signUp({
      email:email,
      password:password,
      options:{
        data:{
          username:username
        }
      }
    });

  if(error){
    throw error;
  }


  if(!data.user){
    throw new Error(
      "Supabase не создал пользователя."
    );
  }


  if(data.session){

    state.session = data.session;
    state.user = data.session.user;

    state.profile =
      await ensureProfile();

    await enterApp(data.session);

    return;
  }


  throw new Error(
    "Аккаунт создан, но Supabase не выдал сессию. Проверь, что подтверждение Email отключено в Authentication → Providers → Email."
  );
}


async function login(username,password){

  username = normalizeUsername(username);

  if(!username || !password){
    throw new Error("Введите имя пользователя и пароль.");
  }

  const email = authEmail(username);

  const {data,error} =
    await db.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){
    throw error;
  }

  if(!data.session){
    throw new Error("Сессия не создана.");
  }

  await enterApp(data.session);
}


async function enterApp(session){

  if(!session || !session.user){
    setScreen(false);
    return;
  }

  if(booting){
    return;
  }

  booting = true;

  try{

    state.session = session;
    state.user = session.user;

    setScreen(true);

    $("currentUser").textContent =
      "Загрузка профиля...";


    try{

      state.profile =
        await ensureProfile();

      $("currentUser").textContent =
        "@" + state.profile.username;

    }catch(profileError){

      console.error(
        "PROFILE ERROR:",
        profileError
      );

      $("currentUser").textContent =
        "Профиль не загрузился";

      /*
        ВАЖНО:
        здесь НЕТ signOut().
        Если профиль временно не загрузился,
        пользователь всё равно остаётся авторизован.
      */
    }


    await loadProfiles();

    setupRealtime();

  }catch(error){

    console.error(
      "ENTER APP ERROR:",
      error
    );

  }finally{

    booting = false;

  }
}


async function loadProfiles(){

  const {data,error} =
    await db
      .from("profiles")
      .select("id,username")
      .neq("id",state.user.id)
      .order("username");

  if(error){
    console.error(
      "PROFILES ERROR:",
      error
    );

    $("users").innerHTML =
      '<div class="empty">Не удалось загрузить пользователей.<br>Проверь RLS в Supabase.</div>';

    return;
  }

  renderUsers(data || []);
}


function renderUsers(users){

  const search =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    users.filter(user =>
      user.username
        .toLowerCase()
        .includes(search)
    );


  if(!filtered.length){

    $("users").innerHTML =
      '<div class="empty">Пользователи не найдены.</div>';

    return;
  }


  $("users").innerHTML =
    filtered.map(user => {

      const active =
        state.selectedUser?.id === user.id
          ? "active"
          : "";

      return `
        <div
          class="user ${active}"
          data-id="${escapeHtml(user.id)}"
        >
          <div class="userName">
            @${escapeHtml(user.username)}
          </div>

          <div class="userId">
            Личный чат
          </div>
        </div>
      `;

    }).join("");


  document
    .querySelectorAll(".user")
    .forEach(element => {

      element.addEventListener(
        "click",
        () => {

          const user =
            users.find(
              x => x.id === element.dataset.id
            );

          if(user){
            openChat(user);
          }

        }
      );

    });
}


async function openChat(user){

  state.selectedUser = user;

  $("app").classList.add("chatOpen");

  $("chatTitle").textContent =
    "@" + user.username;

  renderUsersFromCurrentList();

  await loadMessages();

  subscribeCurrentChat();
}


function renderUsersFromCurrentList(){

  loadProfiles();
}


async function loadMessages(){

  if(!state.selectedUser){
    return;
  }

  const otherId =
    state.selectedUser.id;


  const {data,error} =
    await db
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${state.user.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${state.user.id})`
      )
      .order("created_at",{ascending:true});

  if(error){

    console.error(
      "MESSAGES ERROR:",
      error
    );

    $("messages").innerHTML =
      '<div class="empty">Не удалось загрузить сообщения.<br>Проверь RLS.</div>';

    return;
  }


  state.messages = data || [];

  await renderMessages();
}


async function renderMessages(){

  if(!state.messages.length){

    $("messages").innerHTML =
      '<div class="empty">Сообщений пока нет.<br>Напиши первым.</div>';

    return;
  }


  const html = [];

  for(const message of state.messages){

    const mine =
      message.sender_id === state.user.id;

    let body =
      message.body || "";

    let attachment = null;

    if(body.startsWith("[[ATTACHMENT]]")){

      try{

        attachment =
          JSON.parse(
            body.replace(
              "[[ATTACHMENT]]",
              ""
            )
          );

      }catch(error){

        console.error(
          "Attachment JSON error:",
          error
        );

      }

      body = "";
    }


    let attachmentHtml = "";

    if(attachment){

      try{

        const {data,error} =
          await db.storage
            .from("attachments")
            .createSignedUrl(
              attachment.path,
              3600
            );

        if(error){
          throw error;
        }

        const url = data.signedUrl;

        if(
          attachment.type &&
          attachment.type.startsWith("image/")
        ){

          attachmentHtml = `
            <div class="attachment">
              <img
                src="${escapeHtml(url)}"
                alt="${escapeHtml(attachment.name)}"
              >
            </div>
          `;

        }else if(
          attachment.type &&
          attachment.type.startsWith("audio/")
        ){

          attachmentHtml = `
            <div class="attachment">
              <audio controls src="${escapeHtml(url)}"></audio>
            </div>
          `;

        }else{

          attachmentHtml = `
            <div class="attachment">
              <a
                class="fileLink"
                href="${escapeHtml(url)}"
                target="_blank"
                rel="noopener"
              >
                📎 ${escapeHtml(attachment.name)}
              </a>
            </div>
          `;

        }

      }catch(error){

        console.error(
          "SIGNED URL ERROR:",
          error
        );

        attachmentHtml =
          '<div class="attachment">Не удалось открыть файл</div>';
      }
    }


    html.push(`
      <div class="messageRow ${mine ? "mine" : ""}">
        <div class="message">

          ${
            body
              ? `<div class="messageText">${escapeHtml(body)}</div>`
              : ""
          }

          ${attachmentHtml}

          <div class="messageTime">
            ${formatTime(message.created_at)}
          </div>

        </div>
      </div>
    `);
  }


  $("messages").innerHTML =
    html.join("");

  $("messages").scrollTop =
    $("messages").scrollHeight;
}


async function sendMessage(){

  if(!state.selectedUser){
    alert("Сначала выбери пользователя.");
    return;
  }


  const text =
    $("messageInput")
      .value
      .trim();


  if(!text && !state.attachment){
    return;
  }


  let body = text;


  if(state.attachment){

    body =
      "[[ATTACHMENT]]" +
      JSON.stringify(
        state.attachment
      );

  }


  const {data,error} =
    await db
      .from("messages")
      .insert({
        sender_id:state.user.id,
        receiver_id:state.selectedUser.id,
        body:body
      })
      .select()
      .single();


  if(error){

    console.error(
      "SEND ERROR:",
      error
    );

    alert(
      "Не удалось отправить сообщение:\n" +
      error.message
    );

    return;
  }


  $("messageInput").value = "";

  state.attachment = null;

  $("attachPreview").textContent = "";

  if(data){

    const already =
      state.messages.some(
        x => x.id === data.id
      );

    if(!already){

      state.messages.push(data);

      await renderMessages();

    }

  }
}


async function uploadFile(file){

  if(!state.selectedUser){
    alert("Сначала выбери пользователя.");
    return;
  }


  if(!file){
    return;
  }


  const MAX_SIZE =
    50 * 1024 * 1024;


  if(file.size > MAX_SIZE){

    alert(
      "Максимальный размер файла — 50 МБ."
    );

    return;
  }


  $("attachPreview").textContent =
    "Загрузка: " + file.name;


  const extension =
    file.name.includes(".")
      ? "." +
        file.name
          .split(".")
          .pop()
          .toLowerCase()
      : "";


  const path =
    state.user.id +
    "/" +
    crypto.randomUUID() +
    extension;


  const {error} =
    await db.storage
      .from("attachments")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type || "application/octet-stream"
        }
      );


  if(error){

    console.error(
      "UPLOAD ERROR:",
      error
    );

    $("attachPreview").textContent = "";

    alert(
      "Ошибка загрузки файла:\n" +
      error.message
    );

    return;
  }


  state.attachment = {
    path:path,
    name:file.name,
    type:file.type || "application/octet-stream",
    size:file.size
  };


  $("attachPreview").textContent =
    "Файл готов: " + file.name;
}


function setupRealtime(){

  if(state.channel){

    try{
      db.removeChannel(state.channel);
    }catch(error){
      console.error(error);
    }

    state.channel = null;
  }


  state.channel =
    db
      .channel(
        "messages-" +
        state.user.id +
        "-" +
        crypto.randomUUID()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        async payload => {

          const message =
            payload.new;


          const relevant =
            message.sender_id === state.user.id ||
            message.receiver_id === state.user.id;


          if(!relevant){
            return;
          }


          if(
            state.selectedUser &&
            (
              (
                message.sender_id === state.user.id &&
                message.receiver_id === state.selectedUser.id
              )
              ||
              (
                message.receiver_id === state.user.id &&
                message.sender_id === state.selectedUser.id
              )
            )
          ){

            const exists =
              state.messages.some(
                x => x.id === message.id
              );

            if(!exists){

              state.messages.push(message);

              await renderMessages();

              if(
                document.hidden &&
                message.sender_id !== state.user.id
              ){

                showNotification(
                  "Новое сообщение",
                  "Вам пришло новое сообщение"
                );

              }

            }

          }

        }
      )
      .subscribe();
}


function showNotification(title,text){

  if(
    !("Notification" in window)
  ){
    return;
  }

  if(
    Notification.permission === "granted"
  ){

    new Notification(
      title,
      {
        body:text
      }
    );

  }
}


async function enableNotifications(){

  if(
    !("Notification" in window)
  ){
    alert(
      "Этот браузер не поддерживает уведомления."
    );
    return;
  }


  const permission =
    await Notification.requestPermission();


  if(permission === "granted"){

    alert(
      "Уведомления включены."
    );

  }
}


async function startRecording(){

  if(!state.selectedUser){

    alert(
      "Сначала выбери пользователя."
    );

    return;
  }


  if(!navigator.mediaDevices?.getUserMedia){

    alert(
      "Браузер не поддерживает запись голоса."
    );

    return;
  }


  try{

    recordingStream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });


    recorder =
      new MediaRecorder(
        recordingStream
      );


    recorderChunks = [];


    recorder.ondataavailable =
      event => {

        if(event.data.size > 0){

          recorderChunks.push(
            event.data
          );

        }

      };


    recorder.onstop =
      async () => {

        const blob =
          new Blob(
            recorderChunks,
            {
              type:recorder.mimeType || "audio/webm"
            }
          );


        const file =
          new File(
            [blob],
            "voice-" +
            Date.now() +
            ".webm",
            {
              type:blob.type
            }
          );


        await uploadFile(file);


        if(recordingStream){

          recordingStream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        }

      };


    recorder.start();

    $("recordButton")
      .classList
      .add("recording");

    $("recordButton").textContent =
      "⏹";

  }catch(error){

    console.error(error);

    alert(
      "Не удалось получить доступ к микрофону."
    );

  }
}


function stopRecording(){

  if(
    recorder &&
    recorder.state !== "inactive"
  ){

    recorder.stop();

  }


  $("recordButton")
    .classList
    .remove("recording");

  $("recordButton").textContent =
    "🎤";
}


$("loginTab").addEventListener(
  "click",
  () => {

    authMode = "login";

    $("loginTab")
      .classList
      .add("active");

    $("registerTab")
      .classList
      .remove("active");

    $("authButton").textContent =
      "Войти";

    $("password")
      .setAttribute(
        "autocomplete",
        "current-password"
      );

    setAuthStatus("");

  }
);


$("registerTab").addEventListener(
  "click",
  () => {

    authMode = "register";

    $("registerTab")
      .classList
      .add("active");

    $("loginTab")
      .classList
      .remove("active");

    $("authButton").textContent =
      "Создать аккаунт";

    $("password")
      .setAttribute(
        "autocomplete",
        "new-password"
      );

    setAuthStatus("");

  }
);


$("authForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const username =
      $("username").value;

    const password =
      $("password").value;


    $("authButton").disabled = true;

    setAuthStatus(
      authMode === "login"
        ? "Выполняется вход..."
        : "Создание аккаунта...",
      false
    );


    try{

      if(authMode === "login"){

        await login(
          username,
          password
        );

      }else{

        await register(
          username,
          password
        );

      }

      setAuthStatus(
        "",
        false
      );

    }catch(error){

      console.error(
        "AUTH ERROR:",
        error
      );

      setAuthStatus(
        error.message ||
        "Произошла ошибка."
      );

    }finally{

      $("authButton").disabled =
        false;

    }

  }
);


$("searchInput").addEventListener(
  "input",
  () => loadProfiles()
);


$("sendButton").addEventListener(
  "click",
  sendMessage
);


$("messageInput").addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


$("fileButton").addEventListener(
  "click",
  () => $("fileInput").click()
);


$("fileInput").addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if(file){

      await uploadFile(file);

    }

    event.target.value = "";

  }
);


$("recordButton").addEventListener(
  "click",
  () => {

    if(
      recorder &&
      recorder.state === "recording"
    ){

      stopRecording();

    }else{

      startRecording();

    }

  }
);


$("logoutButton").addEventListener(
  "click",
  async () => {

    try{

      if(state.channel){

        await db.removeChannel(
          state.channel
        );

        state.channel = null;

      }

      await db.auth.signOut();

    }catch(error){

      console.error(
        "LOGOUT ERROR:",
        error
      );

    }

  }
);


$("mobileBack").addEventListener(
  "click",
  () => {

    $("app")
      .classList
      .remove("chatOpen");

    state.selectedUser = null;

    $("chatTitle").textContent =
      "Выберите пользователя";

    $("messages").innerHTML =
      '<div class="empty">Выберите пользователя слева,<br>чтобы начать общение.</div>';

  }
);


db.auth.onAuthStateChange(
  (event,session) => {

    console.log(
      "AUTH EVENT:",
      event,
      !!session
    );


    if(event === "SIGNED_OUT"){

      state.session = null;
      state.user = null;
      state.profile = null;
      state.selectedUser = null;

      setScreen(false);

      return;
    }


    if(
      session &&
      !state.user &&
      !booting
    ){

      setTimeout(
        () => enterApp(session),
        0
      );

    }

  }
);


async function init(){

  setScreen(false);


  const {
    data,
    error
  } = await db.auth.getSession();


  if(error){

    console.error(
      "SESSION ERROR:",
      error
    );

    return;
  }


  if(data?.session){

    await enterApp(
      data.session
    );

  }else{

    setScreen(false);

  }

}


init();

  при первом клике по странице спрашиваем разрешение.

      Notification.permission === "default"
    ){

      Notification.requestPermission()
        .catch(() => {});

    }

  {once:true}
);
